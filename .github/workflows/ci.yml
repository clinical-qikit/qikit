name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    # Two operating systems because some values come from libm's lgamma, whose last ulp
    # differs between macOS/arm64 and linux/x86_64; the snapshot gate compares
    # numerically so both must pass it (scripts/update_snapshots.py).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13", "3.14"]
        include:
          # 3.11 is the runtime the Snowflake procedures in docs/snowflake.md use.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest tests/
      # Recompute the golden snapshots and fail if the committed ones are stale.
      - name: Fail if snapshots are stale
        run: uv run python scripts/update_snapshots.py --check
      # The analysis must import and run without plotly (a Snowpark UDTF never draws).
      - name: Analysis runs without plotly
        run: |
          uv pip uninstall plotly
          uv run --no-sync python -c "import qikit; qikit.qic(y=[1.0, 2, 3, 2], chart='i'); qikit.funnel(y=[3, 5], n=[2.0, 4.0], measure='oe')"

  # The oldest versions pyproject.toml allows of numpy, pandas and plotly, on the oldest
  # Python: a Snowflake runtime pins older packages than a fresh install resolves.
  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: uv sync --extra dev --resolution lowest-direct --python 3.10
      - run: uv run --no-sync pytest tests/

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-addin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: excel-addin/packages/engine
      - run: npx tsc --noEmit
        working-directory: excel-addin/packages/addin
      - run: npm test
      - run: npm run build
      # manifest.json matches the template; it and a production manifest pass
      # Microsoft's validator and the published schema.
      - run: npm run validate
      - run: |
          node scripts/manifest.mjs prod https://example.github.io/qikit/latest/ ../site
          npx office-addin-manifest validate ../site/manifest.json
          npx office-addin-manifest validate ../site/manifest.xml
          node scripts/validate-manifest.mjs ../site/manifest.json
          unzip -l ../site/qikit-excel-addin.zip
