name: Release

# Pushing a tag vX.Y.Z builds that commit, uploads it to PyPI and opens a GitHub Release
# holding that version's CHANGELOG section. PyPI trusts this workflow directly (trusted
# publishing), so no token is stored anywhere. The one-time setup on pypi.org is a
# trusted publisher for owner clinical-qikit, repository qikit, workflow release.yml,
# environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag must be the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/qikit/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: The changelog must have this version
        run: scripts/changelog_section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -q
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clinical-qikit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes/release-notes.md
          --verify-tag
